name: Build Windows with Nuitka

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable Nuitka automatic downloads
        run: |
          Write-Output "NUITKA_ALLOW_DOWNLOADS=1" >> $env:GITHUB_ENV
        shell: powershell

      - name: Upgrade pip and install project dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
        shell: powershell

      - name: Install latest Nuitka with onefile support
        run: |
          python -m pip install --upgrade "nuitka[onefile]"
        shell: powershell

      - name: Install Dependency Walker (depends.exe) into runner and add to PATH
        run: |
          $cacheDir = Join-Path $env:RUNNER_TEMP "depwalker-cache"
          if (-not (Test-Path $cacheDir)) { New-Item -ItemType Directory -Path $cacheDir | Out-Null }
          $zipPath = Join-Path $cacheDir "depends22_x64.zip"
          if (-not (Test-Path $zipPath)) {
            Write-Output "Downloading Dependency Walker..."
            Invoke-WebRequest -Uri "https://dependencywalker.com/depends22_x64.zip" -OutFile $zipPath -UseBasicParsing
            Expand-Archive -Path $zipPath -DestinationPath (Join-Path $cacheDir "extracted")
          } else {
            Write-Output "Using cached Dependency Walker archive."
          }
          $dependsExe = Get-ChildItem (Join-Path $cacheDir "extracted") -Recurse -Filter "depends.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dependsExe) {
            Write-Error "depends.exe not found after extraction"
            exit 1
          }
          $binDir = Split-Path $dependsExe.FullName -Parent
          Write-Output "Adding $binDir to PATH for this job"
          Write-Output $binDir >> $env:GITHUB_PATH
        shell: powershell

      - name: Verify depends.exe on PATH
        run: |
          if (Get-Command depends.exe -ErrorAction SilentlyContinue) {
            Write-Output "depends.exe available:"
            depends.exe /?
          } else {
            Write-Error "depends.exe is not on PATH"
            exit 1
          }
        shell: powershell

      - name: Ensure Dependency Walker and DLLs in Nuitka cache (download fallback)
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:LOCALAPPDATA "Nuitka\depends\x86_64"
          New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
          $destExe = Join-Path $cacheDir "depends.exe"
          if (Test-Path $destExe) {
            Write-Host "depends.exe already present: $destExe"
            exit 0
          }
          Write-Host "depends.exe not found in cache — attempting manual download..."
          $zip = Join-Path $env:RUNNER_TEMP "depends.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "depends_extracted"
          $url = "http://dependencywalker.com/depends22_x64.zip"
          try {
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -ErrorAction Stop
            Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
            Expand-Archive -Path $zip -DestinationPath $extractDir -Force
            $foundExe = Get-ChildItem -Path $extractDir -Filter "depends.exe" -Recurse | Select-Object -First 1
            if ($null -eq $foundExe) {
              Write-Host "depends.exe not found inside downloaded archive."
              Exit 1
            }
            # copy depends.exe
            Copy-Item -Path $foundExe.FullName -Destination $destExe -Force
            Write-Host "depends.exe copied to Nuitka cache: $destExe"
            # copy any DLLs found in the extracted archive to the cache
            $dlls = Get-ChildItem -Path $extractDir -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue
            if ($dlls) {
              foreach ($d in $dlls) {
                $target = Join-Path $cacheDir $d.Name
                Copy-Item -Path $d.FullName -Destination $target -Force
                Write-Host "Copied DLL: $($d.Name) -> $target"
              }
            } else {
              Write-Host "No DLLs found in archive to copy."
            }
          } catch {
            Write-Host "Manual download or extraction failed: $_"
            Exit 1
          } finally {
            Remove-Item $zip -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
          }

      - name: Force-install Dependency Walker into Nuitka cache (final)
        shell: pwsh
        run: |
          $cacheRoot = Join-Path $env:LOCALAPPDATA "Nuitka"
          $cacheDir = Join-Path $cacheRoot "depends\x86_64"
          Write-Host "Nuitka cache root: $cacheRoot"
          New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null

          $destExe = Join-Path $cacheDir "depends.exe"
          $present = Test-Path $destExe
          Write-Host "depends.exe present before action: $present"

          if (-Not $present) {
            Write-Host "Attempting download and extraction of Dependency Walker..."
            $zip = Join-Path $env:RUNNER_TEMP "depends.zip"
            $extractDir = Join-Path $env:RUNNER_TEMP "depends_extracted"
            $url = "http://dependencywalker.com/depends22_x64.zip"
            try {
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -ErrorAction Stop
              Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
              Expand-Archive -Path $zip -DestinationPath $extractDir -Force

              # find and copy executable
              $foundExe = Get-ChildItem -Path $extractDir -Filter "depends.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($null -eq $foundExe) { Write-Host "ERROR: depends.exe not found in downloaded archive."; Exit 1 }
              Copy-Item -Path $foundExe.FullName -Destination $destExe -Force
              Write-Host "Copied depends.exe -> $destExe"

              # copy any DLLs from the extracted archive into cacheDir
              $dlls = Get-ChildItem -Path $extractDir -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue
              if ($dlls.Count -gt 0) {
                foreach ($d in $dlls) {
                  $target = Join-Path $cacheDir $d.Name
                  Copy-Item -Path $d.FullName -Destination $target -Force
                  Write-Host "Copied DLL: $($d.Name) -> $target"
                }
              } else {
                Write-Host "No DLLs found in archive to copy."
              }
            } catch {
              Write-Host "Download/extract failed: $_"
              Exit 1
            } finally {
              Remove-Item $zip -ErrorAction SilentlyContinue
              Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
            }
          } else {
            Write-Host "depends.exe already present; ensuring DLLs exist."
            # still verify at least one DLL presence or warn
            $anyDll = Get-ChildItem -Path $cacheDir -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $anyDll) { Write-Host "Warning: no DLLs found in cache; Nuitka may still ask." }
          }

          # final verification
          Write-Host "Final check:"
          Write-Host "depends.exe exists: " (Test-Path $destExe)
          $dllCount = (Get-ChildItem -Path $cacheDir -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue | Measure-Object).Count
          Write-Host "Number of DLLs in cache: $dllCount"
          if (-Not (Test-Path $destExe)) { Exit 1 }


      - name: Build with Nuitka (standalone onefile, no console)
        run: |
          $env:NUITKA_ALLOW_DOWNLOADS = "1"
          # Adjust input file name (main.pyw) and include-data-dir as needed
          nuitka --standalone --onefile --output-dir=build `
                 --windows-console-mode=disable `
                 --include-data-dir=res=res `
                 main.pyw
        shell: powershell

      - name: Locate built exe
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No executable found in build output"
            exit 1
          }
          Write-Output "Found exe: $($exe.FullName)"
        shell: powershell

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-windows-exe
          path: build\**\*.exe
