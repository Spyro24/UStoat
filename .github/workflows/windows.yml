name: Build with Nuitka (Windows)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      NUITKA_ALLOW_DOWNLOADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install build deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install "Nuitka[onefile]" zstandard

      - name: Copy Dependency Walker from repo to Nuitka cache
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:LOCALAPPDATA "Nuitka\depends\x86_64"
          New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
          $src = Join-Path $GITHUB_WORKSPACE "tools\depends.exe"
          if (-Not (Test-Path $src)) { Write-Host "ERROR: tools\\depends.exe missing in repo"; Exit 1 }
          Copy-Item -Path $src -Destination (Join-Path $cacheDir "depends.exe") -Force
          Write-Host "depends.exe copied to $cacheDir"

      - name: Verify depends.exe
        shell: pwsh
        run: |
          $p = Join-Path $env:LOCALAPPDATA "Nuitka\depends\x86_64\depends.exe"
          Write-Host "depends present: $(Test-Path $p)"
          if (-Not (Test-Path $p)) { Exit 1 }

      - name: Build with Nuitka
        shell: pwsh
        run: |
          Write-Host "NUITKA_ALLOW_DOWNLOADS=$env:NUITKA_ALLOW_DOWNLOADS"
          python -m nuitka --standalone --onefile --output-dir=build `
            --windows-console-mode=disable --include-data-dir=res=res main.pyw

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Path build -Recurse | Format-Table -AutoSize

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-build
          path: build
