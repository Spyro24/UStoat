name: Build with Nuitka

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable Nuitka downloads
        run: |
          echo "NUITKA_ALLOW_DOWNLOADS=1" >> $GITHUB_ENV
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --upgrade nuitka
          sudo apt-get update
          sudo apt-get install -y patchelf unzip
        shell: bash

      - name: Build Linux Executable
        run: |
          export NUITKA_ALLOW_DOWNLOADS=1
          nuitka --standalone --onefile --output-dir=build --include-data-dir=res=res main.pyw
        shell: bash

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: build/*

  build-windows:
    runs-on: windows-latest
    env:
      NUITKA_ALLOW_DOWNLOADS: "1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable Nuitka downloads
        run: |
          Write-Output "NUITKA_ALLOW_DOWNLOADS=1" >> $env:GITHUB_ENV
        shell: powershell

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install --upgrade "nuitka[onefile]"
        shell: powershell

      - name: Build Windows Executable (no console)
        run: |
          $env:NUITKA_ALLOW_DOWNLOADS = "1"
          nuitka --standalone --onefile --output-dir=build `
                 --windows-console-mode=disable `
                 --include-data-dir=res=res `
                 main.pyw
        shell: powershell

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build\*.exe
