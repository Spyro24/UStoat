name: Build with Nuitka

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        run: |
          sudo apt install python3 python-is-python3 python3-tk
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          sudo apt-get update
          sudo apt-get install -y patchelf unzip
        shell: bash

      - name: Build Linux Executable
        run: |
          mkdir build
          cp -r ./res ./build/res
          pyinstaller --onefile --collect-all certifi --collect-all websocket --icon ./res/icons/app_icon_x384.png --name UStoat --add-data "res:res" --distpath dist --workpath build --specpath build main.pyw
        shell: bash

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: ./*

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip and install project dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
        shell: powershell
      
      - name: PyInstaller Windows
        run: |
          pip install pyinstaller
          pip install pillow
          mkdir "D:\a\UStoat\UStoat\build\res" 2>nul
          xcopy /E /I /Y "res" "D:\a\UStoat\UStoat\build\res\"
          pyinstaller --onefile --collect-all certifi --collect-all websocket --icon ./res/icons/app_icon_x384.png --name UStoat --add-data "res;res" --distpath dist --workpath build --specpath build main.pyw
          
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-windows-exe
          path: build\**\*.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ustoat-exe
          path: dist\*.exe
