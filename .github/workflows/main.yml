name: Build with Nuitka

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --upgrade nuitka
          sudo apt-get update
          sudo apt-get install -y patchelf unzip
        shell: bash

      - name: Build Linux Executable
        run: |
          nuitka --standalone --onefile --output-dir=build --include-data-dir=res=res main.pyw
        shell: bash

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: build/*

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install --upgrade "nuitka[onefile]"
        shell: powershell

      - name: Download Dependency Walker
        run: |
          $out = "$env:RUNNER_TEMP\dependencywalker.zip"
          # Official site does not provide a stable direct download; GitHub mirror used here.
          # Replace URL below with your trusted mirror if needed.
          Invoke-WebRequest -Uri "https://github.com/lucasg/Dependencies/releases/download/v1.13.0/Dependencies.zip" -OutFile $out
          Expand-Archive -Path $out -DestinationPath "$env:RUNNER_TEMP\dependencywalker"
          $dwPath = Get-ChildItem "$env:RUNNER_TEMP\dependencywalker" -Recurse -Filter "depends.exe" | Select-Object -First 1
          if (-not $dwPath) { Write-Error "Dependency walker (depends.exe) not found in archive"; exit 1 }
          $binDir = Split-Path $dwPath -Parent
          Write-Output "Found depends.exe in $binDir"
          # Add to PATH for this job
          $env:PATH = "$binDir;$env:PATH"
          Write-Output "Dependency Walker added to PATH"
        shell: powershell

      - name: Verify Dependency Walker
        run: |
          # should print version or usage
          depends.exe || Write-Output "depends invocation returned non-zero exit code"
        shell: powershell

      - name: Build Windows Executable (no console)
        run: |
          nuitka --standalone --onefile --output-dir=build `
                 --windows-console-mode=disable `
                 --include-data-dir=res=res `
                 main.pyw
        shell: powershell

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build\*.exe
